name: Build Linksys EA6350v3 OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUt
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            p7zip-full \
            jq


      # ============================================================
      # CLONE OPENWRT
      # ============================================================

      - name: Clone OpenWrt
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt


      # ============================================================
      # INSTALL PERSISTENT APK SIGNING KEY
      #
      # The private key is stored only in GitHub Secrets.
      #
      # OpenWrt will use:
      #   openwrt/private-key.pem
      #   openwrt/public-key.pem
      #
      # base-files will install the public key into:
      #   /etc/apk/keys/
      # ============================================================

      - name: Install persistent APK signing key
        env:
          EA6350_APK_PRIVATE_KEY: ${{ secrets.EA6350_APK_PRIVATE_KEY }}
        run: |
          set -e

          echo
          echo "========================================"
          echo " INSTALL APK SIGNING KEY"
          echo "========================================"

          if [ -z "$EA6350_APK_PRIVATE_KEY" ]; then
            echo
            echo "ERROR:"
            echo "GitHub Secret EA6350_APK_PRIVATE_KEY is not set."
            exit 1
          fi

          printf '%s\n' \
            "$EA6350_APK_PRIVATE_KEY" \
            > openwrt/private-key.pem

          chmod 600 \
            openwrt/private-key.pem

          echo
          echo "=== Generate public key ==="

          openssl ec \
            -in openwrt/private-key.pem \
            -pubout \
            -out openwrt/public-key.pem

          chmod 644 \
            openwrt/public-key.pem

          echo
          echo "=== Verify signing key ==="

          openssl ec \
            -in openwrt/private-key.pem \
            -check \
            -noout

          echo
          echo "[OK] Persistent APK signing key installed"


      # ============================================================
      # INITIAL DO_STAGE2
      # ============================================================

      - name: Install custom do_stage2 into base-files
        run: |
          set -e

          mkdir -p \
            openwrt/package/base-files/files/lib/upgrade

          cp \
            patches/openwrt/do_stage2 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          chmod 0755 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          echo "=== Custom do_stage2 ==="

          ls -l \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          wc -c \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          echo "=== Current-slot marker ==="

          grep -n \
            "UPGRADE_OPT_USE_CURR_PART" \
            openwrt/package/base-files/files/lib/upgrade/do_stage2


      # ============================================================
      # FEEDS
      # ============================================================

      - name: Update feeds
        working-directory: openwrt
        run: |
          set -e

          ./scripts/feeds update -a


      - name: Install feeds
        working-directory: openwrt
        run: |
          set -e

          ./scripts/feeds install -a


      # ============================================================
      # CUSTOM PACKAGES
      # ============================================================

      - name: Copy custom packages
        run: |
          set -e

          cp -a \
            packages/. \
            openwrt/package/

          echo
          echo "=== Custom package Makefiles ==="

          find openwrt/package \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            | grep -E \
              'ea6350|homeusb' \
            | sort


      # ============================================================
      # VERIFY PACKAGE SOURCES
      # ============================================================

      - name: Check custom package sources
        run: |
          set -e

          echo
          echo "=== ea6350-defaults ==="

          find packages/ea6350-defaults \
            -type f \
            | sort


          echo
          echo "=== ea6350-firmware-manager ==="

          find packages/ea6350-firmware-manager \
            -type f \
            | sort


          echo
          echo "=== ea6350-usb-manager ==="

          if [ ! -d packages/ea6350-usb-manager ]; then
            echo
            echo "ERROR:"
            echo "packages/ea6350-usb-manager does not exist"

            exit 1
          fi

          find packages/ea6350-usb-manager \
            -type f \
            | sort


          echo
          echo "=== homeusb ==="

          find packages/homeusb \
            -type f \
            | sort


          echo
          echo "=== Verify firmware-manager does not contain do_stage2 ==="

          if find packages/ea6350-firmware-manager \
              -path '*/lib/upgrade/do_stage2' \
              -print \
              | grep -q .; then

            echo
            echo "ERROR:"
            echo "firmware-manager must NOT contain:"
            echo "lib/upgrade/do_stage2"

            exit 1
          fi

          echo
          echo "[OK] firmware-manager does not contain do_stage2"


          echo
          echo "=== Verify USB manager does not contain do_stage2 ==="

          if find packages/ea6350-usb-manager \
              -path '*/lib/upgrade/do_stage2' \
              -print \
              | grep -q .; then

            echo
            echo "ERROR:"
            echo "usb-manager must NOT contain:"
            echo "lib/upgrade/do_stage2"

            exit 1
          fi

          echo
          echo "[OK] usb-manager does not contain do_stage2"


      # ============================================================
      # VERIFY PACKAGE LIST
      #
      # The project must use Samba4, not KSMBD.
      # ============================================================

      - name: Verify requested package policy
        run: |
          set -e

          FILE="build/packages.txt"

          echo
          echo "========================================"
          echo " REQUESTED PACKAGE POLICY"
          echo "========================================"

          test -f "$FILE"

          echo
          echo "=== build/packages.txt ==="

          cat "$FILE"


          echo
          echo "=== Required Samba4 packages ==="

          grep -Fx "samba4-server" "$FILE"
          grep -Fx "luci-app-samba4" "$FILE"
          grep -Fx "wsdd2" "$FILE"


          echo
          echo "=== Required custom packages ==="

          grep -Fx "ea6350-defaults" "$FILE"
          grep -Fx "ea6350-firmware-manager" "$FILE"
          grep -Fx "ea6350-usb-manager" "$FILE"


          echo
          echo "=== Check that KSMBD is NOT requested ==="

          if grep -Eq \
              '^(ksmbd-server|luci-app-ksmbd)$' \
              "$FILE"; then

            echo
            echo "ERROR:"
            echo "KSMBD is present in build/packages.txt."
            echo
            echo "This project must use Samba4 instead."
            echo
            echo "Remove:"
            echo "  ksmbd-server"
            echo "  luci-app-ksmbd"

            exit 1
          fi


          echo
          echo "[OK] Package policy is correct"


      # ============================================================
      # INITIAL OPENWRT CONFIG
      # ============================================================

      - name: Prepare OpenWrt configuration
        working-directory: openwrt
        run: |
          set -e

          echo
          echo "=== Generate initial configuration ==="

          make defconfig

          echo
          echo "=== OpenWrt target before modification ==="

          grep -E \
            '^CONFIG_TARGET_' \
            .config \
            | grep -E \
              'ipq40xx|ea6350' \
            || true


      # ============================================================
      # FORCE TARGET AND CORE CUSTOM PACKAGES
      #
      # No ./scripts/config here.
      # ============================================================

      - name: Set OpenWrt target and core packages
        working-directory: openwrt
        run: |
          set -e

          echo
          echo "=== Setting target ==="

          cat >> .config <<'EOF'

          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_linksys_ea6350v3=y

          CONFIG_PACKAGE_ea6350-defaults=y
          CONFIG_PACKAGE_ea6350-firmware-manager=y
          CONFIG_PACKAGE_ea6350-usb-manager=y
          EOF


          echo
          echo "=== Running make defconfig ==="

          make defconfig


          echo
          echo "=== Final target configuration ==="

          grep -E \
            '^CONFIG_TARGET_ipq40xx' \
            .config \
            || true


          echo
          echo "=== Final custom package configuration ==="

          grep -E \
            '^CONFIG_PACKAGE_(ea6350-defaults|ea6350-firmware-manager|ea6350-usb-manager)=' \
            .config \
            || true


      # ============================================================
      # REQUESTED PACKAGES
      # ============================================================

      - name: Configure requested packages
        working-directory: openwrt
        run: |
          set -e

          echo
          echo "=== Requested packages from build/packages.txt ==="

          cat ../build/packages.txt


          echo
          echo "=== Adding requested packages ==="

          while IFS= read -r package || [ -n "$package" ]; do

            # Ignore empty lines
            [ -z "$package" ] && continue

            # Ignore comments
            case "$package" in
              \#*)
                continue
                ;;
            esac

            echo "CONFIG_PACKAGE_$package=y"

          done < ../build/packages.txt \
            | tee /tmp/requested-package-config


          cat /tmp/requested-package-config >> .config


          echo
          echo "=== Normalize configuration ==="

          make defconfig


      # ============================================================
      # VERIFY FINAL PACKAGE CONFIGURATION
      #
      # This is intentionally BEFORE download/build.
      # If Samba4 is unavailable in the 25.12 feeds, the build
      # stops here with a clear error instead of silently building
      # a firmware without Samba4.
      # ============================================================

      - name: Verify final package configuration
        working-directory: openwrt
        run: |
          set -e

          echo
          echo "========================================"
          echo " FINAL PACKAGE CONFIGURATION"
          echo "========================================"


          check_enabled() {
            local symbol="$1"

            if ! grep -qx "CONFIG_PACKAGE_${symbol}=y" .config; then
              echo
              echo "ERROR:"
              echo "CONFIG_PACKAGE_${symbol}=y is NOT enabled."

              echo
              echo "Matching configuration entries:"

              grep -E \
                "^CONFIG_PACKAGE_${symbol}=" \
                .config \
                || true

              exit 1
            fi

            echo "[OK] CONFIG_PACKAGE_${symbol}=y"
          }


          check_disabled() {
            local symbol="$1"

            if grep -qx "CONFIG_PACKAGE_${symbol}=y" .config; then
              echo
              echo "ERROR:"
              echo "CONFIG_PACKAGE_${symbol}=y is enabled."
              echo "This package must NOT be included."

              exit 1
            fi

            echo "[OK] CONFIG_PACKAGE_${symbol} is disabled"
          }


          echo
          echo "=== Target ==="

          grep -qx \
            'CONFIG_TARGET_ipq40xx=y' \
            .config

          grep -qx \
            'CONFIG_TARGET_ipq40xx_generic=y' \
            .config

          grep -qx \
            'CONFIG_TARGET_ipq40xx_generic_DEVICE_linksys_ea6350v3=y' \
            .config

          echo "[OK] Linksys EA6350v3 target"


          echo
          echo "=== Samba4 ==="

          check_enabled samba4-server
          check_enabled luci-app-samba4
          check_enabled wsdd2


          echo
          echo "=== Custom packages ==="

          check_enabled ea6350-defaults
          check_enabled ea6350-firmware-manager
          check_enabled ea6350-usb-manager


          echo
          echo "=== KSMBD ==="

          check_disabled ksmbd-server
          check_disabled luci-app-ksmbd


          echo
          echo "[OK] Final package configuration is correct"


      # ============================================================
      # VERIFY SAMBA4 PACKAGE SOURCE
      #
      # The config check above confirms the symbol.
      # This check confirms that the actual package definition
      # exists in the OpenWrt package tree.
      # ============================================================

      - name: Verify Samba4 package source
        run: |
          set -e

          echo
          echo "========================================"
          echo " SAMBA4 PACKAGE SOURCE"
          echo "========================================"


          SAMBA4_SERVER_DIR="openwrt/feeds/packages/net/samba4"
          SAMBA4_MAKEFILE="$SAMBA4_SERVER_DIR/Makefile"


          if [ ! -f "$SAMBA4_MAKEFILE" ]; then

            echo
            echo "ERROR:"
            echo "Samba4 package source was not found:"
            echo "$SAMBA4_MAKEFILE"

            echo
            echo "This OpenWrt 25.12 feed does not currently provide"
            echo "the Samba4 package definition required by this build."

            exit 1
          fi


          echo
          echo "[OK] Samba4 package definition exists"

          echo
          echo "Makefile:"
          echo "$SAMBA4_MAKEFILE"

          echo
          grep -n \
            -E \
            'PKG_NAME|PKG_VERSION|samba4-server|samba4-libs' \
            "$SAMBA4_MAKEFILE" \
            | head -n 40 \
            || true


      # ============================================================
      # CUSTOM FILES
      # ============================================================

      - name: Copy custom files
        run: |
          set -e

          if [ -d build/files ]; then

            mkdir -p openwrt/files

            cp -a \
              build/files/. \
              openwrt/files/

          fi

          echo
          echo "[OK] Custom files copied"


      # ============================================================
      # FINAL DO_STAGE2
      #
      # Re-copy immediately before build.
      # ============================================================

      - name: Finalize custom do_stage2
        run: |
          set -e

          mkdir -p \
            openwrt/package/base-files/files/lib/upgrade

          cp \
            patches/openwrt/do_stage2 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          chmod 0755 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          FILE="openwrt/package/base-files/files/lib/upgrade/do_stage2"


          echo
          echo "========================================"
          echo " FINAL do_stage2 CHECK"
          echo "========================================"


          test -f "$FILE"

          ls -l "$FILE"

          echo
          wc -c "$FILE"


          echo
          echo "Required marker:"

          grep -n \
            "UPGRADE_OPT_USE_CURR_PART" \
            "$FILE"


          echo
          echo "=== Verify package ownership layout ==="

          if find packages \
              -path '*/files/lib/upgrade/do_stage2' \
              -print \
              | grep -q .; then

            echo
            echo "ERROR:"
            echo "A custom package contains lib/upgrade/do_stage2."

            find packages \
              -path '*/files/lib/upgrade/do_stage2' \
              -print

            exit 1
          fi


          echo
          echo "[OK] No custom package owns do_stage2"


          echo
          echo "[OK] Custom do_stage2 is present immediately before build"


      # ============================================================
      # DOWNLOAD
      # ============================================================

      - name: Download OpenWrt sources
        working-directory: openwrt
        run: |
          set -e

          make download -j$(nproc)


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          set -e

          make -j$(nproc)


      # ============================================================
      # VERIFY SOURCE TREE
      # ============================================================

      - name: Verify custom do_stage2 source after build
        run: |
          set -e

          FILE="openwrt/package/base-files/files/lib/upgrade/do_stage2"


          echo
          echo "========================================"
          echo " do_stage2 SOURCE VERIFICATION"
          echo "========================================"


          test -f "$FILE"

          ls -l "$FILE"


          echo
          wc -c "$FILE"


          echo
          grep -n \
            "UPGRADE_OPT_USE_CURR_PART" \
            "$FILE"


          echo
          echo "[OK] Source tree contains custom do_stage2"


      # ============================================================
      # FIND BASE-FILES APK
      # ============================================================

      - name: Find generated base-files APK
        id: find_basefiles
        run: |
          set -e

          PKG="$(find openwrt/bin/targets \
            -type f \
            -name 'base-files-*.apk' \
            | head -n1)"


          if [ -z "$PKG" ]; then

            echo
            echo "ERROR: base-files APK was not found"

            find openwrt/bin/targets \
              -type f \
              | sort

            exit 1

          fi


          test -f "$PKG"


          echo
          echo "Base-files APK:"
          echo "$PKG"


          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"


      # ============================================================
      # VERIFY BASE-FILES APK
      #
      # Do not use tar tf.
      # ============================================================

      - name: Verify do_stage2 in base-files APK
        run: |
          set -e

          PKG="${{ steps.find_basefiles.outputs.pkg }}"

          APK="openwrt/staging_dir/host/bin/apk"

          DEST="$(mktemp -d)"


          echo
          echo "========================================"
          echo " BASE-FILES APK VERIFICATION"
          echo "========================================"


          echo
          echo "Package:"
          echo "$PKG"


          echo
          echo "APK tool:"
          echo "$APK"


          test -x "$APK"
          test -f "$PKG"


          echo
          echo "APK version:"

          "$APK" --version


          echo
          echo "=== Extracting package ==="

          "$APK" extract \
            --allow-untrusted \
            --no-chown \
            --destination "$DEST" \
            "$PKG"


          echo
          echo "=== Checking do_stage2 ==="

          FILE="$DEST/lib/upgrade/do_stage2"


          if [ ! -f "$FILE" ]; then

            echo
            echo "ERROR:"
            echo "do_stage2 was NOT found inside base-files APK"

            echo
            echo "Package contents:"

            find "$DEST" \
              -type f \
              | grep -E \
                '(^|/)lib/upgrade/' \
              | sort \
              || true

            exit 1

          fi


          echo
          echo "[OK] do_stage2 exists in base-files APK"


          echo
          echo "=== Extracted file ==="

          ls -l "$FILE"


          echo
          echo "Size:"

          wc -c "$FILE"


          echo
          echo "=== Required marker ==="

          grep -n \
            "UPGRADE_OPT_USE_CURR_PART" \
            "$FILE"


          echo
          echo "[OK] Custom do_stage2 is really inside base-files APK"


          rm -rf "$DEST"


      # ============================================================
      # BUILD FIRMWARE MANAGER PACKAGE
      # ============================================================

      - name: Build firmware manager package
        working-directory: openwrt
        run: |
          set -e

          make package/ea6350-firmware-manager/compile V=s


      # ============================================================
      # BUILD USB MANAGER PACKAGE
      # ============================================================

      - name: Build USB manager package
        working-directory: openwrt
        run: |
          set -e

          make package/ea6350-usb-manager/compile V=s


      # ============================================================
      # SIGN CUSTOM EA6350v3 APK PACKAGES
      #
      # OpenWrt 25.12 signs package indexes by default,
      # but individual APK files are signed here explicitly.
      #
      # We sign all project-specific packages:
      #   ea6350-*.apk
      #   homeusb-*.apk
      #
      # The same persistent private key is used for every build.
      # ============================================================

      - name: Sign custom EA6350v3 APK packages
        working-directory: openwrt
        run: |
          set -e

          APK="staging_dir/host/bin/apk"
          KEY="private-key.pem"

          echo
          echo "========================================"
          echo " SIGN CUSTOM APK PACKAGES"
          echo "========================================"
          echo

          test -x "$APK"
          test -f "$KEY"
          test -f "public-key.pem"

          echo "=== Finding custom APK packages ==="

          mapfile -d '' PACKAGES < <(
            find bin/packages \
              -type f \
              \( \
                -name 'ea6350-*.apk' \
                -o \
                -name 'homeusb-*.apk' \
              \) \
              -print0 \
              | sort -z
          )

          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo
            echo "ERROR:"
            echo "No custom EA6350v3 APK packages were found."
            echo
            echo "Available APK packages:"
            find bin/packages \
              -type f \
              -name '*.apk' \
              | sort
            exit 1
          fi

          echo
          echo "Found ${#PACKAGES[@]} custom package(s)."

          for PKG in "${PACKAGES[@]}"; do
            echo
            echo "Signing:"
            echo "  $PKG"

            "$APK" adbsign \
              --allow-untrusted \
              --sign-key "$KEY" \
              "$PKG"

            echo "[OK] Signed:"
            echo "  $PKG"
          done

          echo
          echo "[OK] All custom APK packages signed"


      # ============================================================
      # VERIFY CUSTOM APK SIGNATURES
      # ============================================================

      - name: Verify custom EA6350v3 APK signatures
        working-directory: openwrt
        run: |
          set -e

          APK="staging_dir/host/bin/apk"

          echo
          echo "========================================"
          echo " VERIFY CUSTOM APK SIGNATURES"
          echo "========================================"

          test -x "$APK"
          test -f "public-key.pem"

          mapfile -d '' PACKAGES < <(
            find bin/packages \
              -type f \
              \( \
                -name 'ea6350-*.apk' \
                -o \
                -name 'homeusb-*.apk' \
              \) \
              -print0 \
              | sort -z
          )

          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo
            echo "ERROR:"
            echo "No custom APK packages were found for verification."
            exit 1
          fi

          for PKG in "${PACKAGES[@]}"; do

            echo
            echo "Verifying:"
            echo "  $PKG"

            "$APK" \
              --keys-dir "$PWD" \
              verify \
              "$PKG"

            echo "[OK] Signature verified"

          done

          echo
          echo "========================================"
          echo " ALL CUSTOM APK SIGNATURES ARE VALID"
          echo "========================================"


      # ============================================================
      # VERIFY FIRMWARE MANAGER PACKAGE
      # ============================================================

      - name: Verify firmware manager package
        run: |
          set -e

          APK="openwrt/staging_dir/host/bin/apk"

          PKG="$(find openwrt/bin/packages \
            -type f \
            -name 'ea6350-firmware-manager-*.apk' \
            | head -n1)"


          if [ -z "$PKG" ]; then

            echo
            echo "ERROR: firmware-manager APK not found"

            find openwrt/bin/packages \
              -type f \
              | sort

            exit 1

          fi


          test -f "$PKG"


          DEST="$(mktemp -d)"


          echo
          echo "========================================"
          echo " FIRMWARE MANAGER VERIFICATION"
          echo "========================================"


          echo
          echo "Package:"
          echo "$PKG"


          echo
          echo "=== Extracting package ==="

          "$APK" extract \
            --allow-untrusted \
            --no-chown \
            --destination "$DEST" \
            "$PKG"


          echo
          echo "=== Check that do_stage2 is NOT present ==="

          if [ -f "$DEST/lib/upgrade/do_stage2" ]; then

            echo
            echo "ERROR:"
            echo "firmware-manager package contains do_stage2"

            exit 1

          fi


          echo
          echo "[OK] firmware-manager does not contain do_stage2"


          rm -rf "$DEST"


      # ============================================================
      # VERIFY USB MANAGER PACKAGE
      # ============================================================

      - name: Verify USB manager package
        run: |
          set -e

          APK="openwrt/staging_dir/host/bin/apk"

          PKG="$(find openwrt/bin/packages \
            -type f \
            -name 'ea6350-usb-manager-*.apk' \
            | head -n1)"


          if [ -z "$PKG" ]; then

            echo
            echo "ERROR: usb-manager APK not found"

            find openwrt/bin/packages \
              -type f \
              | sort

            exit 1

          fi


          test -f "$PKG"


          DEST="$(mktemp -d)"


          echo
          echo "========================================"
          echo " USB MANAGER VERIFICATION"
          echo "========================================"


          echo
          echo "Package:"
          echo "$PKG"


          echo
          echo "=== Extracting package ==="

          "$APK" extract \
            --allow-untrusted \
            --no-chown \
            --destination "$DEST" \
            "$PKG"


          echo
          echo "=== Package contents ==="

          find "$DEST" \
            -type f \
            | sort


          echo
          echo "=== Check that do_stage2 is NOT present ==="

          if [ -f "$DEST/lib/upgrade/do_stage2" ]; then

            echo
            echo "ERROR:"
            echo "usb-manager package contains do_stage2"

            exit 1

          fi


          echo
          echo "[OK] usb-manager does not contain do_stage2"


          rm -rf "$DEST"


      # ============================================================
      # VERIFY SAMBA4 PACKAGES
      # ============================================================

      - name: Verify Samba4 packages
        run: |
          set -e

          echo
          echo "========================================"
          echo " SAMBA4 PACKAGE VERIFICATION"
          echo "========================================"


          echo
          echo "=== samba4-server ==="

          find openwrt/bin/packages \
            -type f \
            -name 'samba4-server-*.apk' \
            | sort


          echo
          echo "=== luci-app-samba4 ==="

          find openwrt/bin/packages \
            -type f \
            -name 'luci-app-samba4-*.apk' \
            | sort


          echo
          echo "=== wsdd2 ==="

          find openwrt/bin/packages \
            -type f \
            -name 'wsdd2-*.apk' \
            | sort


          SAMBA4_SERVER="$(find openwrt/bin/packages \
            -type f \
            -name 'samba4-server-*.apk' \
            | head -n1)"


          LUCI_SAMBA4="$(find openwrt/bin/packages \
            -type f \
            -name 'luci-app-samba4-*.apk' \
            | head -n1)"


          WSDD2="$(find openwrt/bin/packages \
            -type f \
            -name 'wsdd2-*.apk' \
            | head -n1)"


          if [ -z "$SAMBA4_SERVER" ]; then

            echo
            echo "ERROR:"
            echo "samba4-server APK was NOT built."

            exit 1

          fi


          if [ -z "$LUCI_SAMBA4" ]; then

            echo
            echo "ERROR:"
            echo "luci-app-samba4 APK was NOT built."

            exit 1

          fi


          if [ -z "$WSDD2" ]; then

            echo
            echo "ERROR:"
            echo "wsdd2 APK was NOT built."

            exit 1

          fi


          echo
          echo "[OK] samba4-server APK exists"
          echo "[OK] luci-app-samba4 APK exists"
          echo "[OK] wsdd2 APK exists"


          echo
          echo "=== Verify KSMBD APKs are absent ==="

          if find openwrt/bin/packages \
              -type f \
              \( \
                -name 'ksmbd-server-*.apk' \
                -o \
                -name 'luci-app-ksmbd-*.apk' \
              \) \
              | grep -q .; then

            echo
            echo "ERROR:"
            echo "KSMBD packages were built."

            find openwrt/bin/packages \
              -type f \
              \( \
                -name 'ksmbd-server-*.apk' \
                -o \
                -name 'luci-app-ksmbd-*.apk' \
              \) \
              | sort

            exit 1

          fi


          echo
          echo "[OK] No KSMBD packages were built"


      # ============================================================
      # SHOW TARGET FIRMWARE
      # ============================================================

      - name: Show firmware output
        run: |
          echo
          echo "========================================"
          echo " FIRMWARE OUTPUT"
          echo "========================================"


          find openwrt/bin/targets \
            -type f \
            | sort


      # ============================================================
      # SHOW PACKAGES
      # ============================================================

      - name: Show package output
      run: |
          echo
          echo "========================================"
          echo " PACKAGE OUTPUT"
          echo "========================================"


          find openwrt/bin/packages \
            -type f \
            -name '*.apk' \
            | sort


      # ============================================================
      # BUILD INFO
      # ============================================================

      - name: Prepare build information
        run: |
          set -e

          mkdir -p build-info


          cp \
            openwrt/.config \
            build-info/openwrt.config


          cp \
            patches/openwrt/do_stage2 \
            build-info/do_stage2.custom


          cp \
            openwrt/package/base-files/files/lib/upgrade/do_stage2 \
            build-info/do_stage2.in-tree


          cp \
            build/packages.txt \
            build-info/packages.txt


          cp \
            packages/ea6350-firmware-manager/Makefile \
            build-info/firmware-manager.Makefile


          cp \
            packages/ea6350-usb-manager/Makefile \
            build-info/usb-manager.Makefile


      # ============================================================
      # FIRMWARE ARTIFACT
      # ============================================================

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: linksys-ea6350v3-firmware
          path: |
            openwrt/bin/targets/ipq40xx/generic/*.bin
            openwrt/bin/targets/ipq40xx/generic/*.img
            openwrt/bin/targets/ipq40xx/generic/*.tar
            openwrt/bin/targets/ipq40xx/generic/*.manifest
            openwrt/bin/targets/ipq40xx/generic/*.json
          if-no-files-found: warn


      # ============================================================
      # PACKAGES ARTIFACT
      # ============================================================

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: linksys-ea6350v3-packages
          path: |
            openwrt/bin/packages/**/*.apk
          if-no-files-found: warn


      # ============================================================
      # BUILD INFO ARTIFACT
      # ============================================================

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: linksys-ea6350v3-build-info
          path: |
            build-info/
          if-no-files-found: warn
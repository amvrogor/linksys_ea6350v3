name: Build OpenWrt EA6350v3

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-25.12
  TZ: Europe/Kyiv

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set timezone
        run: |
          sudo timedatectl set-timezone "${TZ}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gettext \
            git \
            gperf \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lz4 \
            msmtp \
            ninja-build \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xxd \
            zlib1g-dev

      - name: Clone OpenWrt
        run: |
          git clone \
            --single-branch \
            --branch "${REPO_BRANCH}" \
            "${REPO_URL}" \
            openwrt

      - name: Show OpenWrt version
        run: |
          cd openwrt
          git branch --show-current
          git log -1 --oneline

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Add Home Edition packages
        run: |
          cp -a packages/. openwrt/package/

      - name: Add custom files
        run: |
          if [ -d build/files ]; then
            mkdir -p openwrt/files
            cp -a build/files/. openwrt/files/
          fi

      - name: Create configuration
        run: |
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_linksys_ea6350v3=y
          EOF

          while IFS= read -r package; do
            case "$package" in
              ""|\#*)
                continue
                ;;
            esac

            package="$(printf '%s' "$package" | sed 's/[[:space:]]*#.*$//' | xargs)"

            [ -z "$package" ] && continue

            printf 'CONFIG_PACKAGE_%s=y\n' "$package" >> .config
          done < ../build/packages.txt

          echo
          echo "=== Requested packages before defconfig ==="
          grep '^CONFIG_PACKAGE_' .config || true

          make defconfig

          echo
          echo "=== Force Home Edition package ==="
          echo 'CONFIG_PACKAGE_ea6350-defaults=y' >> .config

          make defconfig

          echo
          echo "=== Final Home Edition package configuration ==="
          grep 'CONFIG_PACKAGE_ea6350-defaults' .config || true

      - name: Check requested packages
        run: |
          cd openwrt

          echo "=== Home Edition package ==="
          grep -E 'CONFIG_PACKAGE_ea6350-defaults' .config || true
          echo

          echo "=== Requested package status ==="

          while IFS= read -r package; do
            case "$package" in
              ""|\#*)
                continue
                ;;
            esac

            package="$(printf '%s' "$package" | sed 's/[[:space:]]*#.*$//' | xargs)"

            [ -z "$package" ] && continue

            if grep -q "^CONFIG_PACKAGE_${package}=y$" .config; then
              echo "[OK] $package"
            elif grep -q "^# CONFIG_PACKAGE_${package} is not set$" .config; then
              echo "[NOT SELECTED] $package"
            else
              echo "[UNKNOWN] $package"
            fi
          done < ../build/packages.txt

      - name: Show target configuration
        run: |
          cd openwrt
          echo "=== Target ==="
          grep '^CONFIG_TARGET' .config || true

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Show firmware files
        if: always()
        run: |
          echo "=== Firmware output ==="
          find openwrt/bin/targets/ipq40xx/generic -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_EA6350v3_HomeEdition
          path: |
            openwrt/bin/targets/ipq40xx/generic/*
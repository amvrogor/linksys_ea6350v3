name: Build Linksys EA6350v3 OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            p7zip-full \
            jq


      # ============================================================
      # CLONE OPENWRT
      # ============================================================

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt


      # ============================================================
      # COPY CUSTOM DO_STAGE2
      # ============================================================

      - name: Install custom do_stage2 into base-files
        run: |
          set -e

          mkdir -p \
            openwrt/package/base-files/files/lib/upgrade

          cp \
            patches/openwrt/do_stage2 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          chmod 0755 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          echo "Custom do_stage2 installed:"
          ls -l \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          wc -c \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          grep -n \
            "UPGRADE_OPT_USE_CURR_PART" \
            openwrt/package/base-files/files/lib/upgrade/do_stage2


      # ============================================================
      # FEEDS
      # ============================================================

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a


      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds install -a


      # ============================================================
      # COPY CUSTOM PACKAGES
      # ============================================================

      - name: Copy custom packages
        run: |
          set -e

          cp -a \
            packages/. \
            openwrt/package/

          echo
          echo "Custom packages:"
          find openwrt/package \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            | grep -E \
              "ea6350|homeusb" \
            | sort


      # ============================================================
      # CHECK PACKAGE SOURCES
      # ============================================================

      - name: Check custom package sources
        run: |
          set -e

          echo
          echo "=== ea6350-defaults ==="
          find packages/ea6350-defaults -type f | sort

          echo
          echo "=== ea6350-firmware-manager ==="
          find packages/ea6350-firmware-manager -type f | sort

          echo
          echo "=== homeusb ==="
          find packages/homeusb -type f | sort

          echo
          echo "=== Verify no package-owned do_stage2 ==="
          if find packages/ea6350-firmware-manager \
              -path "*/lib/upgrade/do_stage2" \
              -print \
              | grep -q .; then

            echo "ERROR: do_stage2 must NOT belong to firmware-manager package"
            exit 1
          fi

          echo "[OK] firmware-manager does not contain do_stage2"


      # ============================================================
      # CONFIG
      # ============================================================

      - name: Configure OpenWrt
        run: |
          set -e

          cd openwrt

          make defconfig

          ./scripts/config \
            -e CONFIG_TARGET_ipq40xx \
            -e CONFIG_TARGET_ipq40xx_generic \
            -e CONFIG_TARGET_ipq40xx_generic_DEVICE_linksys_ea6350v3 \
            -e CONFIG_PACKAGE_ea6350-defaults \
            -e CONFIG_PACKAGE_ea6350-firmware-manager

          echo
          echo "=== Target configuration ==="

          ./scripts/config \
            -s CONFIG_TARGET_ipq40xx

          ./scripts/config \
            -s CONFIG_TARGET_ipq40xx_generic

          ./scripts/config \
            -s CONFIG_TARGET_ipq40xx_generic_DEVICE_linksys_ea6350v3

          echo
          echo "=== Custom packages ==="

          ./scripts/config \
            -s CONFIG_PACKAGE_ea6350-defaults

          ./scripts/config \
            -s CONFIG_PACKAGE_ea6350-firmware-manager

          make defconfig


      # ============================================================
      # SHOW PACKAGE LIST
      # ============================================================

      - name: Show requested packages
        run: |
          echo
          echo "=== build/packages.txt ==="
          cat build/packages.txt


      # ============================================================
      # COPY CUSTOM FILES
      # ============================================================

      - name: Copy custom files
        run: |
          set -e

          if [ -d build/files ]; then
            cp -a \
              build/files/. \
              openwrt/files/
          fi

          echo
          echo "Custom files copied."


      # ============================================================
      # FINALIZE DO_STAGE2
      #
      # This is deliberately done immediately before build.
      # ============================================================

      - name: Finalize custom do_stage2
        run: |
          set -e

          mkdir -p \
            openwrt/package/base-files/files/lib/upgrade

          cp \
            patches/openwrt/do_stage2 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          chmod 0755 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          echo "=== Final do_stage2 source ==="

          ls -l \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          wc -c \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          echo "=== Required marker ==="

          grep -n \
            "UPGRADE_OPT_USE_CURR_PART" \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          echo "[OK] Custom do_stage2 is present immediately before build"


      # ============================================================
      # BUILD
      # ============================================================

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)


      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          make -j$(nproc)


      # ============================================================
      # VERIFY SOURCE TREE AFTER BUILD
      # ============================================================

      - name: Verify custom do_stage2 source
        run: |
          set -e

          FILE="openwrt/package/base-files/files/lib/upgrade/do_stage2"

          echo
          echo "=== do_stage2 after build ==="

          test -f "$FILE"

          ls -l "$FILE"

          echo
          wc -c "$FILE"

          echo
          grep -n \
            "UPGRADE_OPT_USE_CURR_PART" \
            "$FILE"

          echo
          echo "[OK] Source tree contains custom do_stage2"


      # ============================================================
      # FIND BASE-FILES APK
      # ============================================================

      - name: Find base-files APK
        id: find_basefiles
        run: |
          set -e

          PKG="$(find openwrt/bin/targets \
            -type f \
            -name 'base-files-*.apk' \
            | head -n1)"

          test -n "$PKG"
          test -f "$PKG"

          echo "Base-files package:"
          echo "$PKG"

          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"


      # ============================================================
      # VERIFY APK MANIFEST
      #
      # IMPORTANT:
      # .apk is NOT a normal tar archive.
      # Use OpenWrt host apk tooling.
      # ============================================================

      - name: Verify do_stage2 in base-files APK
        run: |
          set -e

          PKG="${{ steps.find_basefiles.outputs.pkg }}"

          echo
          echo "=== Package ==="
          echo "$PKG"

          echo
          echo "=== Locate apk tool ==="

          APK="openwrt/staging_dir/host/bin/apk"

          if [ ! -x "$APK" ]; then
            echo "ERROR: OpenWrt host apk tool not found:"
            echo "$APK"
            exit 1
          fi

          "$APK" --version || true

          echo
          echo "=== APK manifest ==="

          "$APK" manifest "$PKG" \
            | grep -E \
              '(^|/)lib/upgrade/do_stage2$'

          echo
          echo "[OK] do_stage2 is present in base-files APK manifest"


      # ============================================================
      # BUILD FIRMWARE MANAGER PACKAGE
      # ============================================================

      - name: Build firmware manager package
        working-directory: openwrt
        run: |
          make package/ea6350-firmware-manager/compile V=s


      # ============================================================
      # VERIFY FIRMWARE MANAGER APK
      # ============================================================

      - name: Verify firmware manager package
        run: |
          set -e

          APK="openwrt/staging_dir/host/bin/apk"

          PKG="$(find openwrt/bin/packages \
            -type f \
            -name 'ea6350-firmware-manager-*.apk' \
            | head -n1)"

          test -n "$PKG"
          test -f "$PKG"

          echo
          echo "Firmware manager package:"
          echo "$PKG"

          echo
          echo "=== Manifest ==="

          "$APK" manifest "$PKG"

          echo
          echo "=== Check forbidden do_stage2 ==="

          if "$APK" manifest "$PKG" \
              | grep -E \
                '(^|/)lib/upgrade/do_stage2$'; then

            echo
            echo "ERROR: firmware-manager package contains do_stage2"
            exit 1
          fi

          echo
          echo "[OK] firmware-manager package does not contain do_stage2"


      # ============================================================
      # SHOW FIRMWARE OUTPUT
      # ============================================================

      - name: Show firmware files
        run: |
          echo
          echo "=== Firmware ==="

          find openwrt/bin/targets \
            -type f \
            | sort


      # ============================================================
      # SHOW PACKAGE OUTPUT
      # ============================================================

      - name: Show package files
        run: |
          echo
          echo "=== Packages ==="

          find openwrt/bin/packages \
            -type f \
            -name '*.apk' \
            | sort


      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Collect firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: linksys-ea6350v3-firmware
          path: |
            openwrt/bin/targets/ipq40xx/generic/*.bin
            openwrt/bin/targets/ipq40xx/generic/*.img
            openwrt/bin/targets/ipq40xx/generic/*.tar
            openwrt/bin/targets/ipq40xx/generic/*.manifest
            openwrt/bin/targets/ipq40xx/generic/*.json
          if-no-files-found: warn


      - name: Collect package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linksys-ea6350v3-packages
          path: |
            openwrt/bin/packages/**/*.apk
          if-no-files-found: warn


      # ============================================================
      # COLLECT BUILD INFO
      # ============================================================

      - name: Collect build information
        uses: actions/upload-artifact@v4
        with:
          name: linksys-ea6350v3-build-info
          path: |
            openwrt/.config
            openwrt/package/base-files/files/lib/upgrade/do_stage2
            build/packages.txt
            packages/ea6350-firmware-manager/Makefile
            patches/openwrt/do_stage2
          if-no-files-found: warn
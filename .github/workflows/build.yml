name: Build OpenWrt EA6350v3

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-25.12
  TZ: Europe/Kyiv

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # System
      # ============================================================

      - name: Set timezone
        run: |
          sudo timedatectl set-timezone "${TZ}"


      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true


      # ============================================================
      # Build dependencies
      # ============================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gettext \
            git \
            gperf \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lz4 \
            msmtp \
            ninja-build \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xxd \
            zlib1g-dev


      # ============================================================
      # OpenWrt source
      # ============================================================

      - name: Clone OpenWrt
        run: |
          git clone \
            --single-branch \
            --branch "${REPO_BRANCH}" \
            "${REPO_URL}" \
            openwrt


      # ============================================================
      # Patch OpenWrt sysupgrade stage2
      #
      # IMPORTANT:
      # do_stage2 belongs to base-files.
      #
      # We replace the source file BEFORE the OpenWrt build.
      # The ea6350-firmware-manager package itself does NOT
      # install /lib/upgrade/do_stage2.
      # ============================================================

      - name: Patch OpenWrt sysupgrade stage2
        run: |
          echo "=== Checking custom do_stage2 patch ==="

          test -f patches/openwrt/do_stage2

          echo
          echo "=== Source patch ==="
          ls -l patches/openwrt/do_stage2

          echo
          echo "=== Current-slot handler ==="
          grep -n \
            'UPGRADE_OPT_USE_CURR_PART' \
            patches/openwrt/do_stage2

          echo
          echo "=== Installing patched do_stage2 into OpenWrt ==="

          cp \
            patches/openwrt/do_stage2 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          chmod 0755 \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          echo "=== Installed do_stage2 ==="
          ls -l \
            openwrt/package/base-files/files/lib/upgrade/do_stage2

          echo
          echo "=== Installed current-slot handler ==="
          grep -n \
            'UPGRADE_OPT_USE_CURR_PART' \
            openwrt/package/base-files/files/lib/upgrade/do_stage2


      # ============================================================
      # OpenWrt version
      # ============================================================

      - name: Show OpenWrt version
        run: |
          cd openwrt

          echo "=== OpenWrt branch ==="
          git branch --show-current

          echo
          echo "=== OpenWrt commit ==="
          git log -1 --oneline


      # ============================================================
      # Feeds
      # ============================================================

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a


      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a


      # ============================================================
      # Home Edition packages
      # ============================================================

      - name: Add Home Edition packages
        run: |
          cp -a packages/. openwrt/package/


      # ============================================================
      # Add custom files
      # ============================================================

      - name: Add custom files
        run: |
          if [ -d build/files ]; then
            mkdir -p openwrt/files
            cp -a build/files/. openwrt/files/
          fi


      # ============================================================
      # Verify Firmware Manager package source
      #
      # There must NOT be:
      #
      #   packages/ea6350-firmware-manager/files/lib/upgrade/do_stage2
      #
      # because do_stage2 is owned by base-files.
      # ============================================================

      - name: Check Firmware Manager source
        run: |
          echo "=== Firmware Manager source files ==="

          find packages/ea6350-firmware-manager/files \
            -type f \
            -print

          echo
          echo "=== Checking that package does not contain do_stage2 ==="

          if [ -e packages/ea6350-firmware-manager/files/lib/upgrade/do_stage2 ]; then
            echo "ERROR: do_stage2 must NOT be inside ea6350-firmware-manager package"
            exit 1
          fi

          echo "[OK] Firmware Manager does not own do_stage2"

          echo
          echo "=== Firmware Manager Makefile install section ==="

          grep -A100 \
            '^define Package/ea6350-firmware-manager/install' \
            packages/ea6350-firmware-manager/Makefile


      # ============================================================
      # Configuration
      # ============================================================

      - name: Create configuration
        run: |
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_linksys_ea6350v3=y
          EOF

          while IFS= read -r package; do

            case "$package" in
              ""|\#*)
                continue
                ;;
            esac

            package="$(printf '%s' "$package" | \
              sed 's/[[:space:]]*#.*$//' | xargs)"

            [ -z "$package" ] && continue

            printf 'CONFIG_PACKAGE_%s=y\n' "$package" >> .config

          done < ../build/packages.txt

          echo
          echo "=== Requested packages before defconfig ==="

          grep '^CONFIG_PACKAGE_' .config || true

          echo
          echo "=== First defconfig ==="

          make defconfig

          echo
          echo "=== Force Home Edition package ==="

          echo 'CONFIG_PACKAGE_ea6350-defaults=y' >> .config

          echo
          echo "=== Second defconfig ==="

          make defconfig

          echo
          echo "=== Final Home Edition package configuration ==="

          grep \
            'CONFIG_PACKAGE_ea6350-defaults' \
            .config || true

          echo
          echo "=== Firmware Manager package configuration ==="

          grep \
            'CONFIG_PACKAGE_ea6350-firmware-manager' \
            .config || true


      # ============================================================
      # Check requested packages
      # ============================================================

      - name: Check requested packages
        run: |
          cd openwrt

          echo "=== Home Edition package ==="

          grep -E \
            'CONFIG_PACKAGE_ea6350-defaults' \
            .config || true

          echo
          echo "=== Requested package status ==="

          while IFS= read -r package; do

            case "$package" in
              ""|\#*)
                continue
                ;;
            esac

            package="$(printf '%s' "$package" | \
              sed 's/[[:space:]]*#.*$//' | xargs)"

            [ -z "$package" ] && continue

            if grep -q \
              "^CONFIG_PACKAGE_${package}=y$" \
              .config; then

              echo "[OK] $package"

            elif grep -q \
              "^# CONFIG_PACKAGE_${package} is not set$" \
              .config; then

              echo "[NOT SELECTED] $package"

            else

              echo "[UNKNOWN] $package"

            fi

          done < ../build/packages.txt


      # ============================================================
      # Target configuration
      # ============================================================

      - name: Show target configuration
        run: |
          cd openwrt

          echo "=== Target ==="

          grep '^CONFIG_TARGET' \
            .config || true


      # ============================================================
      # Download
      # ============================================================

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)


      # ============================================================
      # Build complete firmware
      # ============================================================

      - name: Build firmware
        run: |
          cd openwrt

          make -j$(nproc) || \
            make -j1 V=s


      # ============================================================
      # Build Firmware Manager separately
      # ============================================================

      - name: Build firmware manager package separately
        run: |
          cd openwrt

          make \
            package/ea6350-firmware-manager/compile \
            V=s


      # ============================================================
      # Verify Firmware Manager package
      # ============================================================

      - name: Verify Firmware Manager package
        if: always()
        run: |

          echo "=== Firmware Manager package files ==="

          find openwrt/bin/packages \
            -type f \
            \( \
              -name 'ea6350-firmware-manager*.apk' \
              -o \
              -name 'ea6350-firmware-manager*.ipk' \
            \) \
            -print

          echo
          echo "=== Package contents ==="

          for pkg in $(find openwrt/bin/packages \
            -type f \
            \( \
              -name 'ea6350-firmware-manager*.apk' \
              -o \
              -name 'ea6350-firmware-manager*.ipk' \
            \)); do

            echo
            echo ">>> $pkg"

            tar tf "$pkg" 2>/dev/null | \
              grep -E \
              '(^|/)(do_stage2|ea6350-firmware-manager[^/]*)($|/)' \
              || true

          done


      # ============================================================
      # Show firmware files
      # ============================================================

      - name: Show firmware files
        if: always()
        run: |

          echo "=== Firmware output ==="

          find \
            openwrt/bin/targets/ipq40xx/generic \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            2>/dev/null || true


      # ============================================================
      # Show Firmware Manager package
      # ============================================================

      - name: Show firmware manager package
        if: always()
        run: |

          echo "=== Firmware Manager package output ==="

          find openwrt/bin/packages \
            -type f \
            \( \
              -name 'ea6350-firmware-manager*.apk' \
              -o \
              -name 'ea6350-firmware-manager*.ipk' \
            \) \
            -print \
            2>/dev/null || true


      # ============================================================
      # Upload firmware
      # ============================================================

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_EA6350v3_HomeEdition
          path: |
            openwrt/bin/targets/ipq40xx/generic/*


      # ============================================================
      # Locate Firmware Manager package
      # ============================================================

      - name: Locate firmware manager package
        if: always()
        run: |

          echo "=== Searching for firmware manager package ==="

          find openwrt/bin \
            -type f \
            \( \
              -name 'ea6350-firmware-manager*.apk' \
              -o \
              -name 'ea6350-firmware-manager*.ipk' \
            \) \
            -print


      # ============================================================
      # Prepare Firmware Manager artifact
      # ============================================================

      - name: Prepare firmware manager artifact
        if: always()
        run: |

          rm -rf artifact

          mkdir -p artifact

          find openwrt/bin \
            -type f \
            \( \
              -name 'ea6350-firmware-manager*.apk' \
              -o \
              -name 'ea6350-firmware-manager*.ipk' \
            \) \
            -exec cp -v {} artifact/ \;

          echo
          echo "=== Artifact directory ==="

          ls -lah artifact

          if ! find artifact \
            -type f \
            | grep -q .; then

            echo "ERROR: ea6350-firmware-manager package was not found"

            exit 1

          fi


      # ============================================================
      # Upload Firmware Manager package
      # ============================================================

      - name: Upload firmware manager package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ea6350-firmware-manager-1.0.17
          path: artifact/*
          if-no-files-found: error